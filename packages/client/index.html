<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>루미나 아일 — Lumina Isle</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background: #14152a;
        overflow: hidden;
        touch-action: none;
      }
      canvas#screen {
        display: block;
        width: 100vw;
        height: 100vh;
        image-rendering: pixelated;
        cursor: none;
      }
      #boot {
        position: fixed;
        inset: 0;
        display: grid;
        place-items: center;
        color: #f3e3c3;
        font: 16px sans-serif;
        letter-spacing: 0.1em;
      }
    </style>
  </head>
  <body>
    <div id="boot">등대에 불을 밝히는 중…</div>
    <canvas id="screen"></canvas>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
